<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Markdown 本地浏览器</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f7f4;
        --panel: #ffffff;
        --ink: #1f2933;
        --muted: #68737d;
        --line: #d9ded8;
        --accent: #0f766e;
        --accent-strong: #115e59;
        --accent-soft: #e0f2ef;
        --code-bg: #f0f3f2;
        --warn: #b45309;
        --danger: #b42318;
        --danger-soft: #fef3f2;
        --sidebar-width: 360px;
        --recent-row-height: 58px;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        min-height: 100vh;
        overflow: hidden;
      }

      button {
        font: inherit;
      }

      .app {
        display: grid;
        grid-template-columns: minmax(280px, var(--sidebar-width)) 6px minmax(0, 1fr);
        height: 100vh;
        overflow: hidden;
      }

      .sidebar {
        background: var(--panel);
        min-width: 0;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }

      .resizer {
        background: linear-gradient(to right, transparent, var(--line), transparent);
        cursor: col-resize;
        position: relative;
      }

      .resizer::after {
        content: "";
        position: absolute;
        inset: 0 -5px;
      }

      .resizer:hover,
      .app.resizing .resizer {
        background: var(--accent);
      }

      .app.resizing {
        cursor: col-resize;
        user-select: none;
      }

      .sidebar-header {
        padding: 18px;
        border-bottom: 1px solid var(--line);
        display: grid;
        gap: 12px;
      }

      .title-row {
        display: flex;
        align-items: center;
      }

      h1 {
        margin: 0;
        font-size: 18px;
        line-height: 1.25;
        font-weight: 700;
      }

      .choose-button {
        border: 0;
        border-radius: 8px;
        background: var(--accent);
        color: white;
        padding: 10px 12px;
        cursor: pointer;
        width: 100%;
      }

      .choose-button:hover {
        background: var(--accent-strong);
      }

      .path {
        color: var(--muted);
        font-size: 12px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .search {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px 12px;
        outline: none;
        background: #fbfcfb;
        color: var(--ink);
      }

      .search:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }

      .nav {
        overflow: auto;
        padding: 14px;
        display: grid;
        gap: 18px;
        min-height: 0;
      }

      .nav-section {
        display: grid;
        gap: 8px;
      }

      .section-heading {
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0;
        display: flex;
        justify-content: space-between;
      }

      .file-list,
      .tree {
        display: grid;
        gap: 3px;
      }

      .recent-list {
        max-height: calc(var(--recent-row-height) * 10 + 27px);
        overflow-y: auto;
        padding-right: 3px;
        overscroll-behavior: contain;
      }

      .file-button {
        width: 100%;
        border: 0;
        background: transparent;
        color: var(--ink);
        border-radius: 7px;
        padding: 8px 9px;
        text-align: left;
        cursor: pointer;
        display: grid;
        gap: 2px;
        position: relative;
      }

      .recent-list .file-button {
        min-height: var(--recent-row-height);
      }

      .file-button:hover,
      .file-button.active {
        background: var(--accent-soft);
      }

      .file-button.show-tooltip:hover::after {
        content: attr(data-path);
        position: absolute;
        left: 8px;
        top: calc(100% + 6px);
        z-index: 5;
        max-width: min(520px, 80vw);
        background: #1f2933;
        color: #fff;
        border-radius: 7px;
        padding: 8px 10px;
        font-size: 12px;
        line-height: 1.45;
        box-shadow: 0 10px 24px rgba(31, 41, 51, 0.22);
        white-space: normal;
        overflow-wrap: anywhere;
      }

      .file-name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 14px;
        font-weight: 600;
      }

      .file-meta {
        color: var(--muted);
        font-size: 12px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      details {
        min-width: 0;
      }

      summary {
        color: var(--ink);
        cursor: pointer;
        border-radius: 7px;
        padding: 7px 9px;
        font-size: 14px;
        font-weight: 700;
        list-style: none;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      summary::-webkit-details-marker {
        display: none;
      }

      summary::before {
        content: "▸";
        color: var(--muted);
        margin-right: 6px;
      }

      details[open] > summary::before {
        content: "▾";
      }

      summary:hover {
        background: #eef1ed;
      }

      .tree-children {
        margin-left: 12px;
        padding-left: 10px;
        border-left: 1px solid var(--line);
        display: grid;
        gap: 3px;
      }

      .viewer {
        min-width: 0;
        min-height: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        position: relative;
        overflow: hidden;
      }

      .viewer-header {
        background: rgba(246, 247, 244, 0.92);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--line);
        padding: 16px 26px;
        min-height: 76px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
        align-items: center;
        gap: 18px;
        z-index: 1;
        flex: 0 0 auto;
      }

      .doc-title {
        min-width: 0;
      }

      .doc-title strong {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 18px;
      }

      .doc-title span {
        color: var(--muted);
        display: block;
        margin-top: 3px;
        font-size: 12px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .status {
        color: var(--muted);
        font-size: 12px;
        white-space: nowrap;
      }

      .viewer-tools {
        display: flex;
        align-items: center;
        gap: 8px;
        justify-self: end;
      }

      .center-controls {
        display: flex;
        align-items: center;
        justify-self: center;
        gap: 10px;
        min-width: 0;
      }

      .view-switch {
        border: 1px solid var(--line);
        border-radius: 8px;
        display: flex;
        overflow: hidden;
        background: var(--panel);
        justify-self: center;
      }

      .mode-switch {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 5px 8px;
        background: var(--panel);
        color: var(--muted);
        font-size: 12px;
        white-space: nowrap;
      }

      .mode-switch select {
        border: 0;
        background: transparent;
        color: var(--ink);
        font-size: 12px;
        outline: none;
        min-width: 92px;
        cursor: pointer;
      }

      .view-button {
        border: 0;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        padding: 7px 10px;
        font-size: 12px;
        white-space: nowrap;
      }

      .view-button.active {
        background: var(--accent);
        color: #fff;
      }

      .view-button.error {
        background: var(--danger-soft);
        color: var(--danger);
        font-weight: 700;
        cursor: pointer;
        position: relative;
      }

      .view-button.error::before {
        content: "!";
        display: inline-grid;
        place-items: center;
        width: 16px;
        height: 16px;
        border-radius: 999px;
        background: var(--danger);
        color: #fff;
        font-size: 11px;
        margin-right: 6px;
        vertical-align: middle;
      }

      .view-button.error:hover::after {
        content: attr(data-error);
        position: absolute;
        top: calc(100% + 8px);
        left: 50%;
        transform: translateX(-50%);
        z-index: 6;
        min-width: 220px;
        max-width: min(420px, 60vw);
        border: 1px solid rgba(180, 35, 24, 0.2);
        border-radius: 8px;
        background: rgba(254, 243, 242, 0.98);
        box-shadow: 0 12px 28px rgba(31, 41, 51, 0.14);
        color: var(--danger);
        padding: 10px 12px;
        font-size: 12px;
        font-weight: 600;
        line-height: 1.45;
        text-align: left;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      .view-button:disabled,
      .jump-button:disabled {
        cursor: not-allowed;
        opacity: 0.6;
      }

      .jump-button {
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--panel);
        color: var(--ink);
        cursor: pointer;
        padding: 7px 9px;
        font-size: 12px;
        white-space: nowrap;
      }

      .jump-button:hover {
        border-color: var(--accent);
        color: var(--accent-strong);
        background: var(--accent-soft);
      }

      .content-shell {
        width: 100%;
        flex: 1;
        padding: 0;
        min-height: 0;
        overflow-y: auto;
        scroll-behavior: smooth;
        overscroll-behavior: contain;
      }

      .empty {
        min-height: calc(100vh - 76px);
        display: grid;
        place-items: center;
        text-align: center;
        color: var(--muted);
        padding: 24px;
      }

      .empty-card {
        display: grid;
        gap: 12px;
        max-width: 430px;
      }

      .empty-card h2 {
        color: var(--ink);
        margin: 0;
        font-size: 24px;
      }

      .empty-card p {
        margin: 0;
        line-height: 1.7;
      }

      .markdown-body {
        background: var(--panel);
        min-height: calc(100vh - 76px);
        padding: 34px 42px 64px;
        line-height: 1.75;
        overflow-wrap: anywhere;
      }

      .viewer.outline-visible .markdown-body {
        padding-right: calc(min(280px, 28vw) + 84px);
      }

      .doc-outline {
        position: absolute;
        top: 92px;
        right: 18px;
        z-index: 2;
        width: min(280px, 28vw);
        max-height: min(58vh, 520px);
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.72);
        backdrop-filter: blur(6px);
        box-shadow: 0 12px 28px rgba(31, 41, 51, 0.09);
        padding: 12px;
        display: none;
      }

      .doc-outline.visible {
        display: block;
      }

      .outline-tabs {
        display: flex;
        gap: 4px;
        margin-bottom: 8px;
      }

      .outline-tab {
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        font-size: 12px;
        font-weight: 700;
        padding: 6px 8px;
      }

      .outline-tab.active {
        background: var(--accent-soft);
        color: var(--accent-strong);
      }

      .outline-title {
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        margin-bottom: 8px;
      }

      .outline-list {
        display: grid;
        gap: 3px;
      }

      .outline-link {
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--ink);
        cursor: pointer;
        display: block;
        font-size: 12px;
        line-height: 1.35;
        padding: 6px 7px;
        text-align: left;
        width: 100%;
        overflow-wrap: anywhere;
        white-space: normal;
      }

      .outline-link:hover {
        background: var(--accent-soft);
        color: var(--accent-strong);
      }

      .annotation-item {
        border: 1px solid var(--line);
        border-radius: 7px;
        background: rgba(255, 255, 255, 0.72);
        color: var(--ink);
        cursor: pointer;
        display: grid;
        gap: 4px;
        padding: 8px;
        text-align: left;
        width: 100%;
      }

      .annotation-item:hover {
        border-color: var(--accent);
        background: var(--accent-soft);
      }

      .annotation-quote {
        font-size: 12px;
        font-weight: 700;
        line-height: 1.4;
      }

      .annotation-note {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.4;
      }

      .annotation-mark {
        background: #fff3bf;
        border-bottom: 2px solid var(--warn);
        border-radius: 3px;
        cursor: pointer;
        padding: 0 2px;
      }

      .annotation-mark.active {
        background: #fde68a;
      }

      .selection-float {
        position: fixed;
        z-index: 12;
        display: none;
        border: 1px solid var(--accent);
        border-radius: 8px;
        background: var(--accent);
        color: #fff;
        box-shadow: 0 12px 28px rgba(31, 41, 51, 0.18);
        cursor: pointer;
        font-size: 13px;
        font-weight: 700;
        padding: 8px 12px;
      }

      .annotation-drawer {
        position: absolute;
        left: 18px;
        right: 18px;
        bottom: 18px;
        z-index: 10;
        display: none;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.98);
        box-shadow: 0 20px 54px rgba(31, 41, 51, 0.18);
        padding: 14px;
      }

      .annotation-drawer.visible {
        display: grid;
        gap: 10px;
      }

      .annotation-drawer-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: var(--ink);
        font-size: 14px;
        font-weight: 700;
      }

      .annotation-drawer-quote {
        border-left: 3px solid var(--accent);
        color: var(--muted);
        font-size: 13px;
        line-height: 1.5;
        max-height: 72px;
        overflow: auto;
        padding-left: 10px;
      }

      .annotation-textarea {
        border: 1px solid var(--line);
        border-radius: 7px;
        color: var(--ink);
        font: inherit;
        min-height: 96px;
        padding: 10px;
        resize: vertical;
        width: 100%;
      }

      .annotation-actions {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
      }

      .history-body {
        background: var(--panel);
        min-height: calc(100vh - 76px);
        padding: 30px 42px 64px;
        display: grid;
        align-content: start;
        gap: 16px;
      }

      .history-header,
      .history-document,
      .history-empty {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
      }

      .history-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 16px;
      }

      .history-header-main {
        min-width: 0;
      }

      .history-header-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      .history-mode-switch {
        border: 1px solid var(--line);
        border-radius: 8px;
        display: inline-flex;
        overflow: hidden;
        background: var(--panel);
      }

      .history-mode-button {
        border: 0;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        font-size: 12px;
        padding: 7px 10px;
        white-space: nowrap;
      }

      .history-mode-button.active {
        background: var(--accent);
        color: #fff;
      }

      .history-header h2,
      .history-document h3,
      .history-empty h2 {
        margin: 0;
        color: var(--ink);
      }

      .history-header p,
      .history-document-header p,
      .history-empty p,
      .history-meta {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.5;
        overflow-wrap: anywhere;
      }

      .history-count {
        border-radius: 999px;
        background: var(--accent-soft);
        color: var(--accent-strong);
        font-size: 12px;
        font-weight: 700;
        padding: 6px 10px;
        white-space: nowrap;
      }

      .history-document {
        overflow: hidden;
      }

      .history-document-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 14px;
        border-bottom: 1px solid var(--line);
        padding: 14px 16px;
      }

      .history-document-header h3 {
        font-size: 15px;
      }

      .history-document-header span {
        color: var(--muted);
        font-size: 12px;
        white-space: nowrap;
      }

      .history-list {
        display: grid;
      }

      .history-item {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: start;
        gap: 12px;
        padding: 14px 16px;
      }

      .history-item + .history-item {
        border-top: 1px solid var(--line);
      }

      .history-item-main {
        display: grid;
        gap: 6px;
        min-width: 0;
      }

      .history-quote {
        color: var(--ink);
        font-weight: 700;
        line-height: 1.5;
        overflow-wrap: anywhere;
      }

      .history-note {
        border-left: 3px solid var(--accent);
        color: var(--muted);
        line-height: 1.55;
        padding-left: 10px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      .history-empty {
        display: grid;
        gap: 8px;
        justify-items: center;
        padding: 48px 20px;
        text-align: center;
      }

      .history-flat {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        overflow: hidden;
      }

      .history-flat-textarea {
        border: 0;
        color: var(--ink);
        display: block;
        font: 14px/1.7 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        min-height: 420px;
        outline: none;
        padding: 16px;
        resize: vertical;
        width: 100%;
        white-space: pre;
      }

      .outline-level-2 {
        padding-left: 17px;
      }

      .outline-level-3,
      .outline-level-4,
      .outline-level-5,
      .outline-level-6 {
        padding-left: 27px;
      }

      .loading-overlay {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: none;
        place-items: center;
        background: rgba(246, 247, 244, 0.72);
        backdrop-filter: blur(4px);
      }

      .toast {
        position: absolute;
        right: 18px;
        bottom: 74px;
        z-index: 4;
        min-width: 280px;
        max-width: min(420px, calc(100% - 36px));
        border: 1px solid var(--line);
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.96);
        box-shadow: 0 16px 40px rgba(31, 41, 51, 0.14);
        padding: 12px;
        display: none;
        gap: 10px;
      }

      .toast.visible {
        display: grid;
      }

      .toast.error {
        border-color: rgba(180, 35, 24, 0.25);
        background: rgba(254, 243, 242, 0.98);
      }

      .toast.error .toast-message {
        color: var(--danger);
      }

      .toast-message {
        color: var(--ink);
        font-size: 13px;
        line-height: 1.45;
      }

      .toast-actions {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
      }

      .bottom-jump {
        position: absolute;
        right: 18px;
        bottom: 18px;
        z-index: 3;
        box-shadow: 0 10px 24px rgba(31, 41, 51, 0.13);
      }

      .app.loading .loading-overlay {
        display: grid;
      }

      .loading-panel {
        min-width: 240px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        padding: 20px 22px;
        box-shadow: 0 18px 54px rgba(31, 41, 51, 0.14);
        display: grid;
        justify-items: center;
        gap: 12px;
      }

      .spinner {
        width: 30px;
        height: 30px;
        border: 3px solid var(--accent-soft);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      .loading-text {
        color: var(--ink);
        font-size: 14px;
        font-weight: 700;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .markdown-body h1,
      .markdown-body h2,
      .markdown-body h3,
      .markdown-body h4,
      .markdown-body h5,
      .markdown-body h6 {
        margin: 1.6em 0 0.6em;
        line-height: 1.25;
      }

      .markdown-body h1:first-child,
      .markdown-body h2:first-child,
      .markdown-body h3:first-child {
        margin-top: 0;
      }

      .markdown-body h1 {
        font-size: 32px;
      }

      .markdown-body h2 {
        font-size: 24px;
        border-bottom: 1px solid var(--line);
        padding-bottom: 8px;
      }

      .markdown-body h3 {
        font-size: 19px;
      }

      .ai-body {
        display: grid;
        gap: 18px;
      }

      .ai-hero {
        border-bottom: 1px solid var(--line);
        padding-bottom: 18px;
      }

      .ai-hero h1 {
        margin: 0 0 10px;
      }

      .ai-summary {
        color: #40505c;
        font-size: 17px;
        margin: 0;
      }

      .ai-section {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 18px;
        background: rgba(246, 247, 244, 0.58);
      }

      .ai-section h2 {
        border-bottom: 0;
        margin-top: 0;
        padding-bottom: 0;
      }

      .ai-pill-list {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .ai-pill-list li {
        background: var(--accent-soft);
        border-radius: 7px;
        padding: 8px 10px;
      }

      .ai-empty {
        color: var(--muted);
      }

      .markdown-body p,
      .markdown-body ul,
      .markdown-body ol,
      .markdown-body blockquote,
      .markdown-body pre,
      .markdown-body table {
        margin: 0 0 1.05em;
      }

      .markdown-body a {
        color: var(--accent-strong);
      }

      .markdown-body code {
        background: var(--code-bg);
        border-radius: 5px;
        padding: 2px 5px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 0.9em;
      }

      .markdown-body pre {
        background: #17212b;
        color: #eef7f4;
        border-radius: 8px;
        padding: 16px;
        overflow: auto;
      }

      .markdown-body pre code {
        background: transparent;
        color: inherit;
        padding: 0;
      }

      .markdown-body blockquote {
        border-left: 4px solid var(--accent);
        color: #46515c;
        padding: 3px 0 3px 14px;
      }

      .markdown-body img {
        max-width: 100%;
        border-radius: 8px;
      }

      .markdown-body table {
        width: 100%;
        border-collapse: collapse;
        display: block;
        overflow-x: auto;
      }

      .markdown-body th,
      .markdown-body td {
        border: 1px solid var(--line);
        padding: 8px 10px;
      }

      .markdown-body th {
        background: #eef1ed;
      }

      .notice {
        color: var(--warn);
        font-size: 13px;
      }

      @media (max-width: 760px) {
        .app {
          grid-template-columns: 1fr;
        }

        .resizer {
          display: none;
        }

        .sidebar {
          max-height: 48vh;
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }

        .viewer-header {
          position: static;
          padding: 14px 18px;
          align-items: flex-start;
          grid-template-columns: 1fr;
        }

        .viewer-tools {
          flex-wrap: wrap;
          justify-self: start;
        }

        .center-controls {
          flex-wrap: wrap;
          justify-self: start;
        }

        .view-switch {
          justify-self: start;
        }

        .mode-switch {
          width: 100%;
          justify-content: space-between;
        }

        .mode-switch select {
          min-width: 0;
          flex: 1;
        }

        .content-shell {
          padding: 0;
        }

        .markdown-body {
          min-height: auto;
          padding: 22px;
        }

        .history-body {
          min-height: auto;
          padding: 18px;
        }

        .history-header,
        .history-document-header,
        .history-item {
          grid-template-columns: 1fr;
          align-items: stretch;
        }

        .history-header,
        .history-document-header {
          display: grid;
        }

        .history-count,
        .history-document-header span {
          justify-self: start;
        }

        .history-header-actions {
          justify-content: flex-start;
        }

        .doc-outline {
          display: none !important;
        }

        .bottom-jump {
          right: 14px;
          bottom: 14px;
        }

        .toast {
          left: 14px;
          right: 14px;
          bottom: 62px;
          max-width: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <aside class="sidebar">
        <div class="sidebar-header">
          <div class="title-row">
            <h1>Markdown 浏览</h1>
          </div>
          <div class="path" id="currentPath">尚未选择目录</div>
          <button class="choose-button" id="chooseDir" type="button">选择本地目录</button>
          <input class="search" id="search" type="search" placeholder="筛选 md 文件" />
        </div>
        <nav class="nav" aria-label="Markdown 文件导航">
          <section class="nav-section">
            <div class="section-heading">
              <span>最近更新</span>
              <span id="recentCount">0</span>
            </div>
            <div class="file-list recent-list" id="recentList"></div>
          </section>
          <section class="nav-section">
            <div class="section-heading">
              <span>目录结构</span>
              <span id="treeCount">0</span>
            </div>
            <div class="tree" id="treeList"></div>
          </section>
        </nav>
      </aside>

      <div class="resizer" id="resizer" role="separator" aria-label="调整目录栏宽度"></div>

      <section class="viewer">
        <header class="viewer-header">
          <div class="doc-title">
            <strong id="docName">未打开文件</strong>
            <span id="docPath">选择左侧 Markdown 文件后在这里预览</span>
          </div>
          <div class="center-controls">
            <div class="view-switch" aria-label="预览模式">
              <button class="view-button active" id="rawView" type="button">原文</button>
              <button class="view-button" id="aiView" type="button">AI 阅读版</button>
              <button class="view-button" id="historyView" type="button">历史注释</button>
            </div>
            <label class="mode-switch" for="readingMode">
              <span>阅读模式</span>
              <select id="readingMode">
                <option value="auto">自动</option>
                <option value="general">通用</option>
                <option value="task">任务文档</option>
                <option value="api">接口文档</option>
                <option value="design">设计文档</option>
              </select>
            </label>
          </div>
          <div class="viewer-tools">
            <button class="jump-button" id="scrollTop" type="button">↑ 顶部</button>
            <button class="jump-button" id="regenerateAi" type="button" style="display: none">重新生成</button>
            <div class="status" id="status">HTML 预览</div>
          </div>
        </header>
        <button class="jump-button bottom-jump" id="scrollBottom" type="button">↓ 底部</button>
        <div class="toast" id="toast">
          <div class="toast-message" id="toastMessage"></div>
          <div class="toast-actions">
            <button class="jump-button" id="toastDismiss" type="button">稍后</button>
            <button class="jump-button" id="toastAction" type="button">切换查看</button>
          </div>
        </div>
        <button class="selection-float" id="selectionRecord" type="button">记录</button>
        <aside class="doc-outline" id="docOutline" aria-label="当前文档目录">
          <div class="outline-tabs">
            <button class="outline-tab active" id="outlineTab" type="button">目录</button>
            <button class="outline-tab" id="annotationTab" type="button">注释</button>
          </div>
          <div class="outline-list" id="outlineList"></div>
          <div class="outline-list" id="annotationList" hidden></div>
        </aside>
        <section class="annotation-drawer" id="annotationDrawer" aria-label="文字记录">
          <div class="annotation-drawer-title">
            <span>文字记录</span>
            <button class="jump-button" id="annotationClose" type="button">关闭</button>
          </div>
          <div class="annotation-drawer-quote" id="annotationQuote"></div>
          <textarea class="annotation-textarea" id="annotationText" placeholder="写下这段文字的记录"></textarea>
          <div class="annotation-actions">
            <button class="jump-button" id="annotationDelete" type="button">删除</button>
            <button class="jump-button" id="annotationSave" type="button">保存</button>
          </div>
        </section>
        <div class="content-shell" id="contentShell">
          <div class="empty">
            <div class="empty-card">
              <h2>选择一个本地目录</h2>
              <p>左侧会生成两个入口：最近更新按 Markdown 文件更新时间倒序排列，目录结构保留原始层级。</p>
              <p class="notice" id="supportNotice"></p>
            </div>
          </div>
        </div>
      </section>
      <div class="loading-overlay" id="loadingOverlay" aria-live="polite" aria-busy="true">
        <div class="loading-panel">
          <div class="spinner" aria-hidden="true"></div>
          <div class="loading-text" id="loadingText">正在解析目录</div>
        </div>
      </div>
    </main>

    <script>
      const state = {
        files: [],
        tree: null,
        activePath: "",
        query: "",
        expandedDirs: new Set(),
        rootPath: "",
        currentFile: null,
        currentMarkdown: "",
        annotations: [],
        annotationHistory: [],
        annotationHistoryMode: "grouped",
        annotationStorePath: "",
        annotationDraft: null,
        annotationPanelTab: "outline",
        viewMode: "raw",
        refreshInFlight: false,
        refreshTimer: null,
        eventSource: null,
        eventRefreshTimer: null,
        aiPendingKey: "",
        aiPendingPath: "",
        aiErrorPath: "",
        aiErrorMessage: "",
        readingMode: "auto",
        toastAction: null,
        toastTimer: null,
      };

      const AI_CACHE_VERSION = "v3-mode-aware";

      const els = {
        app: document.querySelector(".app"),
        chooseDir: document.querySelector("#chooseDir"),
        currentPath: document.querySelector("#currentPath"),
        resizer: document.querySelector("#resizer"),
        search: document.querySelector("#search"),
        recentList: document.querySelector("#recentList"),
        treeList: document.querySelector("#treeList"),
        recentCount: document.querySelector("#recentCount"),
        treeCount: document.querySelector("#treeCount"),
        docName: document.querySelector("#docName"),
        docPath: document.querySelector("#docPath"),
        docOutline: document.querySelector("#docOutline"),
        outlineList: document.querySelector("#outlineList"),
        outlineTab: document.querySelector("#outlineTab"),
        annotationTab: document.querySelector("#annotationTab"),
        annotationList: document.querySelector("#annotationList"),
        selectionRecord: document.querySelector("#selectionRecord"),
        annotationDrawer: document.querySelector("#annotationDrawer"),
        annotationQuote: document.querySelector("#annotationQuote"),
        annotationText: document.querySelector("#annotationText"),
        annotationClose: document.querySelector("#annotationClose"),
        annotationDelete: document.querySelector("#annotationDelete"),
        annotationSave: document.querySelector("#annotationSave"),
        rawView: document.querySelector("#rawView"),
        aiView: document.querySelector("#aiView"),
        historyView: document.querySelector("#historyView"),
        readingMode: document.querySelector("#readingMode"),
        regenerateAi: document.querySelector("#regenerateAi"),
        toast: document.querySelector("#toast"),
        toastMessage: document.querySelector("#toastMessage"),
        toastDismiss: document.querySelector("#toastDismiss"),
        toastAction: document.querySelector("#toastAction"),
        scrollTop: document.querySelector("#scrollTop"),
        scrollBottom: document.querySelector("#scrollBottom"),
        status: document.querySelector("#status"),
        contentShell: document.querySelector("#contentShell"),
        loadingText: document.querySelector("#loadingText"),
        supportNotice: document.querySelector("#supportNotice"),
      };

      els.chooseDir.disabled = false;
      els.chooseDir.textContent = "选择本地目录";
      els.currentPath.textContent = "尚未选择目录";

      els.chooseDir.addEventListener("click", chooseDirectory);
      els.search.addEventListener("input", () => {
        state.query = els.search.value.trim().toLowerCase();
        renderNavigation();
      });
      els.rawView.addEventListener("click", () => switchView("raw"));
      els.aiView.addEventListener("click", () => {
        const aiErrored = Boolean(state.aiErrorPath) && state.currentFile && state.aiErrorPath === state.currentFile.path;
        switchView("ai", aiErrored ? { regenerate: true } : {});
      });
      els.historyView.addEventListener("click", () => switchView("history"));
      els.readingMode.addEventListener("change", () => {
        state.readingMode = els.readingMode.value;
        if (!state.currentFile) return;
        const wasAi = state.viewMode === "ai";
        if (wasAi) {
          switchView("ai");
        } else {
          showToast(`已切换到${readingModeLabel(state.readingMode)}。下次生成 AI 阅读版时生效。`);
        }
      });
      els.regenerateAi.addEventListener("click", () => switchView("ai", { regenerate: true }));
      els.toastDismiss.addEventListener("click", hideToast);
      els.toastAction.addEventListener("click", () => {
        const action = state.toastAction;
        hideToast();
        if (typeof action === "function") action();
      });
      els.scrollTop.addEventListener("click", () => scrollContentTo("top"));
      els.scrollBottom.addEventListener("click", () => scrollContentTo("bottom"));
      els.outlineTab.addEventListener("click", () => switchAnnotationPanel("outline"));
      els.annotationTab.addEventListener("click", () => switchAnnotationPanel("annotations"));
      els.selectionRecord.addEventListener("click", () => openAnnotationDrawer(state.annotationDraft));
      els.annotationClose.addEventListener("click", closeAnnotationDrawer);
      els.annotationSave.addEventListener("click", saveCurrentAnnotation);
      els.annotationDelete.addEventListener("click", deleteCurrentAnnotation);
      els.contentShell.addEventListener("mouseup", handleTextSelection);
      els.contentShell.addEventListener("keyup", handleTextSelection);
      els.contentShell.addEventListener("scroll", hideSelectionRecord);
      initResizableSidebar();
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) refreshDirectoryIfNeeded();
      });
      window.addEventListener("focus", () => refreshDirectoryIfNeeded());

      async function chooseDirectory() {
        els.chooseDir.disabled = true;
        els.chooseDir.textContent = "选择中...";
        els.status.textContent = "等待目录选择";

        try {
          const response = await fetch("/api/choose-directory", { method: "POST" });
          const snapshot = await response.json().catch(() => ({}));
          if (!response.ok) {
            throw new Error(snapshot.error || "无法选择目录。");
          }

          if (snapshot.canceled) {
            els.status.textContent = "已取消选择";
            return;
          }

          await loadDirectorySnapshot(snapshot);
        } catch (error) {
          els.status.textContent = "读取失败";
          renderEmpty("目录读取失败", error.message || "无法读取这个目录。");
        } finally {
          els.chooseDir.disabled = false;
          els.chooseDir.textContent = "选择本地目录";
        }
      }

      async function loadDirectorySnapshot(snapshot) {
        try {
          setLoading(true, "正在解析目录");
          await waitForPaint();
          els.status.textContent = "扫描中";
          state.activePath = "";
          state.rootPath = snapshot.rootPath;
          state.expandedDirs.clear();
          els.currentPath.textContent = snapshot.rootName || snapshot.rootPath;
          state.files = snapshot.files || [];
          state.tree = snapshot.tree || createTreeNode(snapshot.rootName || "已选择目录");
          els.status.textContent = `${state.files.length} 个 Markdown 文件`;
          renderNavigation();
          connectDirectoryEvents();
          startDirectoryRefreshLoop();

          if (state.files[0]) {
            await openFile(state.files[0]);
          } else {
            renderEmpty("没有找到 Markdown 文件", "这个目录下没有 .md 或 .markdown 文件。");
          }
        } catch (error) {
          els.status.textContent = "读取失败";
          renderEmpty("目录读取失败", error.message || "无法读取这个目录。");
        } finally {
          setLoading(false);
        }
      }

      function createTreeNode(name) {
        return { name, dirs: [], files: [] };
      }

      function isMarkdownFile(name) {
        return /\.(md|markdown)$/i.test(name);
      }

      function renderNavigation() {
        const files = getFilteredFiles();
        els.recentCount.textContent = files.length;
        els.treeCount.textContent = files.length;
        els.recentList.replaceChildren(
          ...files.map((file) => renderFileButton(file, { showTooltip: true })),
        );
        els.treeList.replaceChildren(state.tree ? renderTreeNode(state.tree, true, []) : document.createDocumentFragment());
      }

      function getFilteredFiles() {
        if (!state.query) return [...state.files];
        return state.files.filter((file) =>
          file.path.toLowerCase().includes(state.query),
        );
      }

      function renderFileButton(file, options = {}) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = [
          "file-button",
          file.path === state.activePath ? "active" : "",
          options.showTooltip ? "show-tooltip" : "",
        ].filter(Boolean).join(" ");
        button.title = file.path;
        button.dataset.path = file.path;
        button.innerHTML = `
          <span class="file-name">${escapeHtml(file.name)}</span>
          <span class="file-meta">${escapeHtml(formatDate(file.lastModified))} · ${escapeHtml(file.path)}</span>
        `;
        button.addEventListener("click", () => openFile(file));
        return button;
      }

      function renderTreeNode(node, isRoot = false, pathParts = []) {
        const container = document.createElement("div");
        container.className = isRoot ? "tree-root" : "tree-children";

        const visibleFiles = node.files.filter(matchesQuery);
        const visibleDirs = node.dirs
          .map((dir) => ({ dir, hasVisible: treeHasMatches(dir) }))
          .filter((entry) => entry.hasVisible)
          .map((entry) => entry.dir);

        if (!isRoot) {
          const directoryPath = pathParts.join("/");
          const details = document.createElement("details");
          details.open = Boolean(state.query) || state.expandedDirs.has(directoryPath);
          details.addEventListener("toggle", () => {
            if (details.open) {
              state.expandedDirs.add(directoryPath);
            } else {
              state.expandedDirs.delete(directoryPath);
            }
          });
          const summary = document.createElement("summary");
          summary.textContent = node.name;
          details.append(summary);
          const children = document.createElement("div");
          children.className = "tree-children";
          visibleDirs.forEach((dir) => children.append(renderTreeNode(dir, false, [...pathParts, dir.name])));
          visibleFiles.forEach((file) => children.append(renderFileButton(file)));
          details.append(children);
          return details;
        }

        visibleDirs.forEach((dir) => container.append(renderTreeNode(dir, false, [dir.name])));
        visibleFiles.forEach((file) => container.append(renderFileButton(file)));
        return container;
      }

      function treeHasMatches(node) {
        return (
          node.files.some(matchesQuery) ||
          node.dirs.some((child) => treeHasMatches(child))
        );
      }

      function matchesQuery(file) {
        return !state.query || file.path.toLowerCase().includes(state.query);
      }

      async function openFile(file) {
        try {
          els.status.textContent = "读取中";
          const response = await fetch("/api/read-file", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ rootPath: state.rootPath, path: file.path }),
          });
          const payload = await response.json().catch(() => ({}));
          if (!response.ok) {
            throw new Error(payload.error || "无法读取这个 Markdown 文件。");
          }

          const markdown = payload.markdown || "";
          state.activePath = file.path;
          state.currentFile = file;
          state.currentMarkdown = markdown;
          state.viewMode = "raw";
          state.aiErrorPath = "";
          state.aiErrorMessage = "";
          await loadAnnotations(file.path);
          els.docName.textContent = file.name;
          els.docPath.textContent = `${file.path} · ${formatDate(file.lastModified)} · ${formatSize(file.size)}`;
          renderRawMarkdown();
          updateViewButtons();
          els.status.textContent = "HTML 预览";
          renderNavigation();
        } catch (error) {
          els.status.textContent = "读取失败";
          renderEmpty("文件读取失败", error.message || "无法读取这个 Markdown 文件。");
        }
      }

      function renderEmpty(title, text) {
        els.docName.textContent = title;
        els.docPath.textContent = text;
        state.currentFile = null;
        state.currentMarkdown = "";
        state.annotations = [];
        state.annotationDraft = null;
        state.viewMode = "raw";
        state.aiErrorPath = "";
        state.aiErrorMessage = "";
        updateViewButtons();
        clearDocumentOutline();
        renderAnnotationList();
        closeAnnotationDrawer();
        hideSelectionRecord();
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.innerHTML = `
          <div class="empty-card">
            <h2>${escapeHtml(title)}</h2>
            <p>${escapeHtml(text)}</p>
          </div>
        `;
        els.contentShell.replaceChildren(empty);
      }

      async function switchView(mode, options = {}) {
        if (mode === "history") {
          await renderAnnotationHistory();
          return;
        }

        if (!state.currentFile) return;

        if (mode === "raw") {
          state.viewMode = "raw";
          updateViewButtons();
          renderRawMarkdown();
          els.status.textContent = "HTML 预览";
          return;
        }

        const key = getAiCacheKey(state.currentFile);
        const cached = !options.regenerate ? getAiCache(key) : null;
        if (cached) {
          state.viewMode = "ai";
          updateViewButtons();
          renderAiReading(cached);
          els.status.textContent = "AI 阅读版";
          return;
        }

        state.viewMode = "raw";
        updateViewButtons();
        els.status.textContent = "AI 后台生成中";
        renderRawMarkdown();
        await generateAiReadingInBackground(options);
      }

      function updateViewButtons() {
        els.rawView.classList.toggle("active", state.viewMode === "raw");
        els.aiView.classList.toggle("active", state.viewMode === "ai");
        els.historyView.classList.toggle("active", state.viewMode === "history");
        els.readingMode.closest(".mode-switch").style.display = state.viewMode === "history" ? "none" : "";
        const aiErrored = Boolean(state.aiErrorPath) && state.currentFile && state.aiErrorPath === state.currentFile.path;
        els.aiView.classList.toggle("error", aiErrored && state.viewMode !== "ai");
        els.regenerateAi.style.display = state.currentFile && state.viewMode === "ai" ? "" : "none";
        const aiPending = Boolean(state.aiPendingKey) && state.currentFile && state.aiPendingPath === state.currentFile.path;
        els.rawView.disabled = !state.currentFile;
        els.aiView.disabled = !state.currentFile || aiPending;
        els.aiView.textContent = aiPending ? "AI 生成中..." : aiErrored ? "AI 失败" : "AI 阅读版";
        els.aiView.title = "";
        els.aiView.dataset.error = aiErrored
          ? `${state.aiErrorMessage || "AI 阅读版生成失败"}\A点击可重新生成`
          : "";
      }

      function renderRawMarkdown() {
        const article = document.createElement("article");
        article.className = "markdown-body";
        article.insertAdjacentHTML("beforeend", markdownToHtml(state.currentMarkdown));
        els.contentShell.replaceChildren(article);
        applyAnnotationHighlights(article);
        buildDocumentOutline();
        renderAnnotationList();
        scrollContentTo("top", "auto");
      }

      async function generateAiReadingInBackground(options = {}) {
        if (!state.currentFile) return;
        const key = getAiCacheKey(state.currentFile);
        if (state.aiPendingKey === key) {
          return;
        }

        try {
          state.aiPendingKey = key;
          state.aiPendingPath = state.currentFile.path;
          state.aiErrorPath = "";
          state.aiErrorMessage = "";
          updateViewButtons();
          const pendingFile = state.currentFile;
          const pendingMarkdown = state.currentMarkdown;

        const response = await fetch("/api/ai-read", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({
              path: pendingFile.path,
              lastModified: pendingFile.lastModified,
              markdown: pendingMarkdown,
              readingMode: state.readingMode,
            }),
          });

          const payload = await response.json().catch(() => ({}));
          if (!response.ok) {
            throw new Error(payload.error || "AI 阅读版生成失败");
          }

          setAiCache(key, payload.result);
          state.aiErrorPath = "";
          state.aiErrorMessage = "";
          if (state.currentFile && state.currentFile.path === pendingFile.path) {
            els.status.textContent = "AI 阅读版已就绪";
            showToast("AI 阅读版已生成完成。", "切换查看", () => {
              state.viewMode = "ai";
              updateViewButtons();
              renderAiReading(payload.result);
              els.status.textContent = "AI 阅读版";
            });
          }
        } catch (error) {
          els.status.textContent = "AI 失败";
          if (state.currentFile && state.currentFile.path === state.aiPendingPath) {
            state.aiErrorPath = state.currentFile.path;
            state.aiErrorMessage = error.message || "无法生成 AI 阅读版。";
            showToast(state.aiErrorMessage, "知道了", null, { tone: "error" });
          }
        } finally {
          state.aiPendingKey = "";
          state.aiPendingPath = "";
          updateViewButtons();
        }
      }

      function renderAiReading(result) {
        const summary = sanitizeTextBlock(result.summary || "");
        const highlights = sanitizeItems(result.highlights);
        const sections = sanitizeSections(result.sections);
        const risks = sanitizeItems(result.risks);
        const todos = sanitizeItems(result.todos);

        const article = document.createElement("article");
        article.className = "markdown-body ai-body";
        article.innerHTML = `
          <section class="ai-hero">
            <h1>${escapeHtml(result.title || state.currentFile.name)}</h1>
            ${summary ? `<p class="ai-summary">${inlineMarkdown(summary)}</p>` : ""}
          </section>
          ${renderAiListSection("重点速览", highlights, "ai-pill-list")}
          ${renderAiSections(sections)}
          ${renderAiListSection("风险与待确认", risks)}
          ${renderAiListSection("后续行动", todos)}
        `;
        els.contentShell.replaceChildren(article);
        buildDocumentOutline();
        renderAnnotationList();
        scrollContentTo("top", "auto");
      }

      function renderAiSections(sections = []) {
        if (!sections.length) {
          return "";
        }

        return sections
          .map((section) => `
            <section class="ai-section">
              <h2>${escapeHtml(section.title || "未命名分区")}</h2>
              ${section.content ? `<p>${inlineMarkdown(section.content)}</p>` : ""}
              ${renderPlainList(section.items)}
            </section>
          `)
          .join("");
      }

      function renderAiListSection(title, items = [], listClass = "") {
        if (!items.length) {
          return "";
        }

        return `
          <section class="ai-section">
            <h2>${escapeHtml(title)}</h2>
            ${renderPlainList(items, listClass)}
          </section>
        `;
      }

      function renderPlainList(items = [], listClass = "") {
        return `
          <ul class="${escapeHtml(listClass)}">
            ${items.map((item) => `<li>${inlineMarkdown(item)}</li>`).join("")}
          </ul>
        `;
      }

      function sanitizeItems(items = []) {
        return (Array.isArray(items) ? items : [])
          .map((item) => String(item || "").trim())
          .map((item) => sanitizeTextBlock(item))
          .filter(Boolean);
      }

      function sanitizeSections(sections = []) {
        return (Array.isArray(sections) ? sections : [])
          .map((section) => ({
            title: String(section?.title || "").trim(),
            content: sanitizeTextBlock(String(section?.content || "").trim()),
            items: sanitizeItems(section?.items || []),
          }))
          .filter((section) => section.title || section.content || section.items.length);
      }

      function sanitizeTextBlock(value = "") {
        const text = String(value || "").trim();
        if (!text) return "";
        if (/^暂无(摘要|内容)?[。.]?$/u.test(text)) return "";
        if (/^无(内容)?[。.]?$/u.test(text)) return "";
        if (/^(未提炼出|没有提炼出).*[。.]?$/u.test(text)) return "";
        if (/^codex 没有提炼出.*[。.]?$/iu.test(text)) return "";
        return text;
      }

      function renderAiError(message) {
        const article = document.createElement("article");
        article.className = "markdown-body";
        article.innerHTML = `
          <h1>AI 阅读版生成失败</h1>
          <p>${escapeHtml(message)}</p>
          <p>请确认当前页面由本地 Node 服务启动，并且终端里的 <code>codex</code> 命令可用。</p>
        `;
        els.contentShell.replaceChildren(article);
        clearDocumentOutline();
      }

      async function loadAnnotations(path) {
        if (!state.rootPath || !path) {
          state.annotations = [];
          return;
        }

        const response = await fetch("/api/annotations/list", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ rootPath: state.rootPath, path }),
        });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(payload.error || "无法读取注释。");
        }
        state.annotations = payload.annotations || [];
      }

      function handleTextSelection() {
        if (!state.currentFile || state.viewMode !== "raw") {
          hideSelectionRecord();
          return;
        }

        const selection = window.getSelection();
        if (!selection || selection.rangeCount !== 1 || selection.isCollapsed) {
          hideSelectionRecord();
          return;
        }

        const range = selection.getRangeAt(0);
        const article = els.contentShell.querySelector(".markdown-body");
        if (!article || !article.contains(range.commonAncestorContainer)) {
          hideSelectionRecord();
          return;
        }

        const quote = selection.toString().trim();
        if (!quote) {
          hideSelectionRecord();
          return;
        }

        const offsets = getSelectionOffsets(article, range);
        const fullText = article.textContent || "";
        state.annotationDraft = {
          quote,
          note: "",
          contextBefore: fullText.slice(Math.max(0, offsets.start - 80), offsets.start),
          contextAfter: fullText.slice(offsets.end, offsets.end + 80),
        };

        const rect = range.getBoundingClientRect();
        els.selectionRecord.style.left = `${Math.min(window.innerWidth - 84, Math.max(12, rect.left + rect.width / 2 - 28))}px`;
        els.selectionRecord.style.top = `${Math.max(12, rect.top - 44)}px`;
        els.selectionRecord.style.display = "block";
      }

      function getSelectionOffsets(root, range) {
        const before = range.cloneRange();
        before.selectNodeContents(root);
        before.setEnd(range.startContainer, range.startOffset);
        const start = before.toString().length;
        return { start, end: start + range.toString().length };
      }

      function hideSelectionRecord() {
        els.selectionRecord.style.display = "none";
      }

      function openAnnotationDrawer(annotation) {
        if (!annotation) return;
        state.annotationDraft = { ...annotation };
        els.annotationQuote.textContent = annotation.quote || "";
        els.annotationText.value = annotation.note || "";
        els.annotationDelete.style.display = annotation.id ? "" : "none";
        els.annotationDrawer.classList.add("visible");
        hideSelectionRecord();
        window.getSelection()?.removeAllRanges();
        els.annotationText.focus();
      }

      function closeAnnotationDrawer() {
        els.annotationDrawer.classList.remove("visible");
        state.annotationDraft = null;
      }

      async function saveCurrentAnnotation() {
        if (!state.currentFile || !state.annotationDraft) return;
        const note = els.annotationText.value.trim();
        if (!note) {
          showToast("记录内容不能为空。", "知道了", null, { tone: "error" });
          return;
        }

        const response = await fetch("/api/annotations/save", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({
            rootPath: state.rootPath,
            path: state.currentFile.path,
            annotation: { ...state.annotationDraft, note },
          }),
        });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok) {
          showToast(payload.error || "保存记录失败。", "知道了", null, { tone: "error" });
          return;
        }

        state.annotations = payload.annotations || [];
        closeAnnotationDrawer();
        renderCurrentViewAfterAnnotationChange();
        showToast("记录已保存。");
      }

      async function deleteCurrentAnnotation() {
        if (!state.currentFile || !state.annotationDraft?.id) return;
        const response = await fetch("/api/annotations/delete", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({
            rootPath: state.rootPath,
            path: state.currentFile.path,
            id: state.annotationDraft.id,
          }),
        });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok) {
          showToast(payload.error || "删除记录失败。", "知道了", null, { tone: "error" });
          return;
        }

        state.annotations = payload.annotations || [];
        closeAnnotationDrawer();
        renderCurrentViewAfterAnnotationChange();
        showToast("记录已删除。");
      }

      function renderCurrentViewAfterAnnotationChange() {
        if (state.viewMode === "ai" && state.currentFile) {
          const cached = getAiCache(getAiCacheKey(state.currentFile));
          if (cached) {
            renderAiReading(cached);
            return;
          }
        }

        state.viewMode = "raw";
        updateViewButtons();
        renderRawMarkdown();
      }

      async function renderAnnotationHistory() {
        state.viewMode = "history";
        updateViewButtons();
        hideSelectionRecord();
        closeAnnotationDrawer();
        els.status.textContent = "读取历史注释";
        els.docName.textContent = "历史注释";
        els.docPath.textContent = "正在读取全局记录";
        clearDocumentOutline();

        try {
          const response = await fetch("/api/annotations/all");
          const payload = await response.json().catch(() => ({}));
          if (!response.ok) {
            throw new Error(payload.error || "无法读取历史注释。");
          }

          state.annotationHistory = payload.documents || [];
          state.annotationStorePath = payload.storePath || "~/.markdown-viewer/annotations.json";
          renderAnnotationHistoryPage(payload.count || 0);
          els.docPath.textContent = `${state.annotationStorePath} · ${payload.count || 0} 条记录`;
          els.status.textContent = "历史注释";
          scrollContentTo("top", "auto");
        } catch (error) {
          const article = document.createElement("article");
          article.className = "history-body";
          article.innerHTML = `
            <section class="history-empty">
              <h2>历史注释读取失败</h2>
              <p>${escapeHtml(error.message || "无法读取历史注释。")}</p>
            </section>
          `;
          els.contentShell.replaceChildren(article);
          els.docPath.textContent = error.message || "无法读取历史注释。";
          els.status.textContent = "读取失败";
        }
      }

      function renderAnnotationHistoryPage(count) {
        const article = document.createElement("article");
        article.className = "history-body";

        const header = document.createElement("section");
        header.className = "history-header";
        header.innerHTML = `
          <div class="history-header-main">
            <h2>历史注释</h2>
            <p>${escapeHtml(state.annotationStorePath || "~/.markdown-viewer/annotations.json")}</p>
          </div>
          <div class="history-header-actions">
            <div class="history-mode-switch" aria-label="历史注释展示方式">
              <button class="history-mode-button ${state.annotationHistoryMode === "grouped" ? "active" : ""}" type="button" data-history-mode="grouped">按文档</button>
              <button class="history-mode-button ${state.annotationHistoryMode === "flat" ? "active" : ""}" type="button" data-history-mode="flat">单行</button>
            </div>
            <button class="jump-button" type="button" data-history-copy ${count ? "" : "disabled"}>复制全部</button>
            <span class="history-count">${count} 条</span>
          </div>
        `;
        header.querySelectorAll("[data-history-mode]").forEach((button) => {
          button.addEventListener("click", () => {
            state.annotationHistoryMode = button.dataset.historyMode || "grouped";
            renderAnnotationHistoryPage(count);
          });
        });
        header.querySelector("[data-history-copy]").addEventListener("click", copyHistoryNotes);
        article.append(header);

        if (!state.annotationHistory.length) {
          const empty = document.createElement("section");
          empty.className = "history-empty";
          empty.innerHTML = `
            <h2>还没有历史注释</h2>
            <p>在任意 Markdown 文档里选中文字并点击“记录”后，会出现在这里。</p>
          `;
          article.append(empty);
          els.contentShell.replaceChildren(article);
          return;
        }

        if (state.annotationHistoryMode === "flat") {
          article.append(renderHistoryFlatNotes());
        } else {
          state.annotationHistory.forEach((historyDocument) => {
            article.append(renderHistoryDocument(historyDocument));
          });
        }
        els.contentShell.replaceChildren(article);
      }

      function renderHistoryFlatNotes() {
        const section = document.createElement("section");
        section.className = "history-flat";

        const textarea = document.createElement("textarea");
        textarea.className = "history-flat-textarea";
        textarea.readOnly = true;
        textarea.spellcheck = false;
        textarea.value = historyNotesText();
        section.append(textarea);
        return section;
      }

      function renderHistoryDocument(historyDocument) {
        const section = document.createElement("section");
        section.className = "history-document";
        section.innerHTML = `
          <div class="history-document-header">
            <div>
              <h3>${escapeHtml(historyDocument.fileName || historyDocument.path)}</h3>
              <p>${escapeHtml(historyDocument.path)} · ${escapeHtml(historyDocument.rootName || historyDocument.rootPath)}</p>
            </div>
            <span>${historyDocument.annotations.length} 条</span>
          </div>
        `;

        const list = document.createElement("div");
        list.className = "history-list";
        historyDocument.annotations
          .slice()
          .sort((a, b) => Date.parse(b.updatedAt || b.createdAt || 0) - Date.parse(a.updatedAt || a.createdAt || 0))
          .forEach((annotation) => {
            list.append(renderHistoryAnnotation(historyDocument, annotation));
          });
        section.append(list);
        return section;
      }

      function renderHistoryAnnotation(historyDocument, annotation) {
        const item = document.createElement("div");
        item.className = "history-item";
        item.innerHTML = `
          <div class="history-item-main">
            <div class="history-quote">${escapeHtml(annotation.quote)}</div>
            <div class="history-note">${escapeHtml(annotation.note)}</div>
            <div class="history-meta">${escapeHtml(formatDate(annotation.updatedAt || annotation.createdAt))} · ${escapeHtml(historyDocument.rootPath)}</div>
          </div>
        `;

        const action = document.createElement("button");
        action.className = "jump-button";
        action.type = "button";
        action.textContent = "打开";
        action.addEventListener("click", () => openHistoryAnnotation(historyDocument, annotation));
        item.append(action);
        return item;
      }

      async function openHistoryAnnotation(historyDocument, annotation) {
        if (state.rootPath !== historyDocument.rootPath) {
          showToast("请先选择这条记录所在的目录。", "知道了", null, { tone: "error" });
          return;
        }

        const file = state.files.find((item) => item.path === historyDocument.path);
        if (!file) {
          showToast("当前目录里没有找到这篇文档。", "知道了", null, { tone: "error" });
          return;
        }

        await openFile(file);
        switchAnnotationPanel("annotations");
        setTimeout(() => {
          scrollAnnotationIntoView(annotation.id);
          openAnnotationDrawer(state.annotations.find((item) => item.id === annotation.id) || annotation);
        }, 80);
      }

      async function copyHistoryNotes() {
        const text = historyNotesText();
        if (!text) {
          showToast("没有可复制的注释。", "知道了");
          return;
        }

        try {
          await navigator.clipboard.writeText(text);
          showToast("已复制全部注释。");
        } catch {
          state.annotationHistoryMode = "flat";
          renderAnnotationHistoryPage(flattenedHistoryAnnotations().length);
          const textarea = els.contentShell.querySelector(".history-flat-textarea");
          if (textarea) {
            textarea.focus();
            textarea.select();
          }
          showToast("已选中注释内容，可直接复制。");
        }
      }

      function historyNotesText() {
        return flattenedHistoryAnnotations()
          .map(({ annotation }) => singleLineAnnotation(annotation.note))
          .filter(Boolean)
          .join("\n");
      }

      function flattenedHistoryAnnotations() {
        return state.annotationHistory
          .flatMap((historyDocument) =>
            (historyDocument.annotations || []).map((annotation) => ({
              historyDocument,
              annotation,
            })),
          )
          .sort((a, b) =>
            Date.parse(b.annotation.updatedAt || b.annotation.createdAt || 0) -
            Date.parse(a.annotation.updatedAt || a.annotation.createdAt || 0),
          );
      }

      function singleLineAnnotation(value) {
        return String(value || "").replace(/\s+/g, " ").trim();
      }

      function renderAnnotationList() {
        els.annotationList.replaceChildren(
          ...state.annotations.map((annotation) => {
            const button = document.createElement("button");
            button.type = "button";
            button.className = "annotation-item";
            button.innerHTML = `
              <span class="annotation-quote">${escapeHtml(annotation.quote)}</span>
              <span class="annotation-note">${escapeHtml(annotation.note)}</span>
            `;
            button.addEventListener("click", () => {
              scrollAnnotationIntoView(annotation.id);
              openAnnotationDrawer(annotation);
            });
            return button;
          }),
        );
        updateSidePanelVisibility();
      }

      function applyAnnotationHighlights(article) {
        if (!state.annotations.length) return;

        const textNodes = collectTextNodes(article);
        const fullText = textNodes.map((node) => node.nodeValue).join("");
        const ranges = state.annotations
          .map((annotation) => ({
            annotation,
            index: locateAnnotationIndex(fullText, annotation),
          }))
          .filter((entry) => entry.index >= 0)
          .map(({ annotation, index }) => ({
            annotation,
            start: index,
            end: index + annotation.quote.length,
          }))
          .sort((a, b) => a.start - b.start);

        wrapAnnotationTextSegments(textNodes, ranges);
      }

      function collectTextNodes(root) {
        const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
        const nodes = [];
        let node = walker.nextNode();
        while (node) {
          nodes.push(node);
          node = walker.nextNode();
        }
        return nodes;
      }

      function wrapAnnotationTextSegments(textNodes, ranges) {
        const segmentsByNode = new Map();
        let cursor = 0;

        for (const node of textNodes) {
          const nodeStart = cursor;
          const nodeEnd = cursor + node.nodeValue.length;
          cursor = nodeEnd;

          for (const range of ranges) {
            if (range.end <= nodeStart) continue;
            if (range.start >= nodeEnd) break;

            const start = Math.max(range.start, nodeStart) - nodeStart;
            const end = Math.min(range.end, nodeEnd) - nodeStart;
            const text = node.nodeValue.slice(start, end);
            if (!text.trim()) continue;

            const segments = segmentsByNode.get(node) || [];
            segments.push({ start, end, annotation: range.annotation });
            segmentsByNode.set(node, segments);
          }
        }

        for (const [node, segments] of segmentsByNode) {
          wrapNodeSegments(node, segments);
        }
      }

      function wrapNodeSegments(node, segments) {
        if (!node.parentNode) return;
        const accepted = [];
        let nextStart = node.nodeValue.length + 1;

        segments
          .sort((a, b) => b.start - a.start || b.end - a.end)
          .forEach((segment) => {
            if (segment.end <= nextStart) {
              accepted.push(segment);
              nextStart = segment.start;
            }
          });

        let source = node;
        for (const segment of accepted) {
          if (!source.parentNode || segment.end > source.nodeValue.length) continue;

          source.splitText(segment.end);
          const target = source.splitText(segment.start);
          const mark = document.createElement("span");
          mark.className = "annotation-mark";
          mark.dataset.annotationId = segment.annotation.id;
          mark.title = segment.annotation.note;
          mark.addEventListener("click", () => openAnnotationDrawer(segment.annotation));
          mark.setAttribute("role", "button");
          mark.tabIndex = 0;
          target.parentNode.insertBefore(mark, target);
          mark.append(target);
        }
      }

      function locateAnnotationIndex(fullText, annotation) {
        const quote = annotation.quote || "";
        if (!quote) return -1;

        const indexes = [];
        let index = fullText.indexOf(quote);
        while (index >= 0) {
          indexes.push(index);
          index = fullText.indexOf(quote, index + quote.length);
        }
        if (!indexes.length) return -1;
        if (indexes.length === 1) return indexes[0];

        return indexes
          .map((candidate) => ({
            candidate,
            score:
              contextScore(fullText, candidate, annotation.contextBefore, "before") +
              contextScore(fullText, candidate + quote.length, annotation.contextAfter, "after"),
          }))
          .sort((a, b) => b.score - a.score)[0].candidate;
      }

      function contextScore(fullText, index, context, side) {
        if (!context) return 0;
        const sample = side === "before"
          ? fullText.slice(Math.max(0, index - context.length), index)
          : fullText.slice(index, index + context.length);
        let score = 0;
        const max = Math.min(sample.length, context.length);
        for (let i = 0; i < max; i += 1) {
          const sampleChar = side === "before" ? sample[sample.length - 1 - i] : sample[i];
          const contextChar = side === "before" ? context[context.length - 1 - i] : context[i];
          if (sampleChar !== contextChar) break;
          score += 1;
        }
        return score;
      }

      function createTextRange(textNodes, start, end) {
        let cursor = 0;
        let startNode = null;
        let startOffset = 0;
        let endNode = null;
        let endOffset = 0;

        for (const node of textNodes) {
          const next = cursor + node.nodeValue.length;
          if (!startNode && start >= cursor && start <= next) {
            startNode = node;
            startOffset = start - cursor;
          }
          if (!endNode && end >= cursor && end <= next) {
            endNode = node;
            endOffset = end - cursor;
            break;
          }
          cursor = next;
        }

        if (!startNode || !endNode) return null;
        const range = document.createRange();
        range.setStart(startNode, startOffset);
        range.setEnd(endNode, endOffset);
        return range;
      }

      function scrollAnnotationIntoView(annotationId) {
        const mark = els.contentShell.querySelector(`.annotation-mark[data-annotation-id="${CSS.escape(annotationId)}"]`);
        if (!mark) return;
        mark.classList.add("active");
        mark.scrollIntoView({ block: "center", behavior: "smooth" });
        setTimeout(() => mark.classList.remove("active"), 1200);
      }

      function showToast(message, actionLabel = "知道了", action = null, options = {}) {
        if (state.toastTimer) {
          clearTimeout(state.toastTimer);
        }
        els.toastMessage.textContent = message;
        els.toastAction.textContent = actionLabel;
        els.toastAction.style.display = action ? "" : "none";
        state.toastAction = action;
        els.toast.classList.toggle("error", options.tone === "error");
        els.toast.classList.add("visible");
        state.toastTimer = setTimeout(() => {
          hideToast();
        }, 3000);
      }

      function hideToast() {
        if (state.toastTimer) {
          clearTimeout(state.toastTimer);
          state.toastTimer = null;
        }
        state.toastAction = null;
        els.toast.classList.remove("visible");
        els.toast.classList.remove("error");
      }

      function getAiCacheKey(file) {
        return `ai-reading:${AI_CACHE_VERSION}:${state.readingMode}:${file.path}:${file.lastModified}:${file.size}`;
      }

      function readingModeLabel(mode) {
        switch (mode) {
          case "general":
            return "通用模式";
          case "task":
            return "任务文档模式";
          case "api":
            return "接口文档模式";
          case "design":
            return "设计文档模式";
          default:
            return "自动模式";
        }
      }

      function getAiCache(key) {
        try {
          return JSON.parse(localStorage.getItem(key));
        } catch {
          return null;
        }
      }

      function setAiCache(key, value) {
        try {
          localStorage.setItem(key, JSON.stringify(value));
        } catch {
          // 缓存失败不影响阅读。
        }
      }

      function scrollContentTo(position, behavior = "smooth") {
        const top =
          position === "bottom"
            ? Math.max(0, els.contentShell.scrollHeight - els.contentShell.clientHeight)
            : 0;
        els.contentShell.scrollTo({ top, behavior });
      }

      function buildDocumentOutline() {
        const article = els.contentShell.querySelector(".markdown-body");
        const headings = article
          ? [...article.querySelectorAll("h1, h2, h3, h4, h5, h6")]
          : [];

        if (!headings.length) {
          clearDocumentOutline();
          return;
        }

        const usedIds = new Set();
        els.outlineList.replaceChildren(
          ...headings.map((heading) => {
            const level = Number(heading.tagName.slice(1));
            const text = heading.textContent.trim() || "未命名标题";
            const id = uniqueSlug(text, usedIds);
            heading.id = id;

            const button = document.createElement("button");
            button.type = "button";
            button.className = `outline-link outline-level-${level}`;
            button.textContent = text;
            button.title = text;
            button.addEventListener("click", () => scrollHeadingIntoView(heading));
            return button;
          }),
        );
        updateSidePanelVisibility();
      }

      function clearDocumentOutline() {
        els.outlineList.replaceChildren();
        updateSidePanelVisibility();
      }

      function switchAnnotationPanel(tab) {
        state.annotationPanelTab = tab;
        els.outlineTab.classList.toggle("active", tab === "outline");
        els.annotationTab.classList.toggle("active", tab === "annotations");
        els.outlineList.hidden = tab !== "outline";
        els.annotationList.hidden = tab !== "annotations";
      }

      function updateSidePanelVisibility() {
        if (state.viewMode === "history") {
          els.docOutline.classList.remove("visible");
          els.docOutline.closest(".viewer").classList.remove("outline-visible");
          return;
        }

        const hasOutline = els.outlineList.children.length > 0;
        const hasAnnotations = state.annotations.length > 0;
        els.annotationTab.textContent = `注释${hasAnnotations ? ` ${state.annotations.length}` : ""}`;
        els.docOutline.classList.toggle("visible", hasOutline || hasAnnotations);
        els.docOutline.closest(".viewer").classList.toggle("outline-visible", hasOutline || hasAnnotations);
        if (!hasOutline && hasAnnotations) switchAnnotationPanel("annotations");
        if (hasOutline && state.annotationPanelTab !== "annotations") switchAnnotationPanel("outline");
      }

      function scrollHeadingIntoView(heading) {
        const shellRect = els.contentShell.getBoundingClientRect();
        const headingRect = heading.getBoundingClientRect();
        els.contentShell.scrollTo({
          top: els.contentShell.scrollTop + headingRect.top - shellRect.top - 18,
          behavior: "smooth",
        });
      }

      function uniqueSlug(text, usedIds) {
        const base =
          text
            .toLowerCase()
            .trim()
            .replace(/[^\p{L}\p{N}]+/gu, "-")
            .replace(/^-+|-+$/g, "") || "heading";
        let id = base;
        let index = 2;
        while (usedIds.has(id)) {
          id = `${base}-${index}`;
          index += 1;
        }
        usedIds.add(id);
        return id;
      }

      function markdownToHtml(markdown) {
        const blocks = [];
        let source = markdown.replace(/\r\n?/g, "\n");
        source = source.replace(/```([\w-]*)\n([\s\S]*?)```/g, (_, lang, code) => {
          const index = blocks.push(
            `<pre><code class="language-${escapeHtml(lang)}">${escapeHtml(code.trimEnd())}</code></pre>`,
          );
          return `\n@@BLOCK_${index - 1}@@\n`;
        });

        source = source.replace(/^\|(.+)\|\n\|([\s:-]+\|)+\n((?:\|.*\|\n?)*)/gm, (match) => {
          const rows = match
            .trim()
            .split("\n")
            .map((row) => row.slice(1, -1).split("|").map((cell) => cell.trim()));
          const [headers, , ...body] = rows;
          const table = [
            "<table><thead><tr>",
            ...headers.map((cell) => `<th>${inlineMarkdown(cell)}</th>`),
            "</tr></thead><tbody>",
            ...body.flatMap((row) => [
              "<tr>",
              ...row.map((cell) => `<td>${inlineMarkdown(cell)}</td>`),
              "</tr>",
            ]),
            "</tbody></table>",
          ].join("");
          const index = blocks.push(table);
          return `\n@@BLOCK_${index - 1}@@\n`;
        });

        const lines = source.split("\n");
        const html = [];
        let paragraph = [];
        let listStack = [];
        let quote = [];

        const flushParagraph = () => {
          if (!paragraph.length) return;
          html.push(`<p>${inlineMarkdown(paragraph.join(" "))}</p>`);
          paragraph = [];
        };

        const closeLists = (targetDepth = 0) => {
          while (listStack.length > targetDepth) {
            html.push(`</${listStack.pop()}>`);
          }
        };
