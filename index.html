        const flushQuote = () => {
          if (!quote.length) return;
          html.push(`<blockquote>${quote.map((line) => `<p>${inlineMarkdown(line)}</p>`).join("")}</blockquote>`);
          quote = [];
        };

        for (const rawLine of lines) {
          const line = rawLine.trimEnd();
          const blockMatch = line.match(/^@@BLOCK_(\d+)@@$/);
          if (blockMatch) {
            flushParagraph();
            flushQuote();
            closeLists();
            html.push(blocks[Number(blockMatch[1])]);
            continue;
          }

          if (!line.trim()) {
            flushParagraph();
            flushQuote();
            closeLists();
            continue;
          }

          const heading = line.match(/^(#{1,6})\s+(.+)$/);
          if (heading) {
            flushParagraph();
            flushQuote();
            closeLists();
            const level = heading[1].length;
            html.push(`<h${level}>${inlineMarkdown(heading[2])}</h${level}>`);
            continue;
          }

          const quoteLine = line.match(/^>\s?(.*)$/);
          if (quoteLine) {
            flushParagraph();
            closeLists();
            quote.push(quoteLine[1]);
            continue;
          }

          const listItem = line.match(/^(\s*)([-*+]|\d+\.)\s+(.+)$/);
          if (listItem) {
            flushParagraph();
            flushQuote();
            const depth = Math.floor(listItem[1].length / 2);
            const type = /\d+\./.test(listItem[2]) ? "ol" : "ul";
            const level = depth + 1;

            if (listStack[depth] && listStack[depth] !== type) {
              closeLists(depth);
            } else {
              closeLists(level);
            }

            while (listStack.length < level) {
              html.push(`<${type}>`);
              listStack.push(type);
            }

            html.push(`<li>${inlineMarkdown(listItem[3])}</li>`);
            continue;
          }

          closeLists();
          flushQuote();
          paragraph.push(line.trim());
        }

        flushParagraph();
        flushQuote();
        closeLists();

        return html.join("\n");
      }

      function inlineMarkdown(text) {
        let escaped = escapeHtml(text);
        const code = [];
        escaped = escaped.replace(/`([^`]+)`/g, (_, value) => {
          const index = code.push(`<code>${value}</code>`);
          return `§§CODE${index - 1}§§`;
        });
        escaped = escaped
          .replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img alt="$1" src="$2" />')
          .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer">$1</a>')
          .replace(/\*\*([^*\s][^*]*?)\*\*/g, "<strong>$1</strong>")
          .replace(/(^|[^\w])__([^_\s][^_]*?)__(?!\w)/g, "$1<strong>$2</strong>")
          .replace(/\*([^*\s][^*]*?)\*/g, "<em>$1</em>")
          .replace(/(^|[^\w])_([^_\s][^_]*?)_(?!\w)/g, "$1<em>$2</em>")
          .replace(/~~([^~]+)~~/g, "<del>$1</del>");
        code.forEach((html, index) => {
          escaped = escaped.replace(`§§CODE${index}§§`, html);
        });
        return escaped;
      }

      function setLoading(isLoading, text = "正在处理") {
        els.loadingText.textContent = text;
        els.app.classList.toggle("loading", isLoading);
      }

      function startDirectoryRefreshLoop() {
        if (state.refreshTimer) {
          clearInterval(state.refreshTimer);
        }
        state.refreshTimer = setInterval(() => {
          if (!document.hidden) refreshDirectoryIfNeeded();
        }, 30000);
      }

      function stopDirectoryRefreshLoop() {
        if (!state.refreshTimer) return;
        clearInterval(state.refreshTimer);
        state.refreshTimer = null;
      }

      function connectDirectoryEvents() {
        if (state.eventSource) return;

        const source = new EventSource("/api/events");
        state.eventSource = source;

        source.addEventListener("directory-changed", (event) => {
          const payload = JSON.parse(event.data || "{}");
          if (!state.rootPath || payload.rootPath !== state.rootPath) return;

          els.status.textContent = "检测到目录更新";
          if (state.eventRefreshTimer) clearTimeout(state.eventRefreshTimer);
          state.eventRefreshTimer = setTimeout(() => {
            state.eventRefreshTimer = null;
            refreshDirectoryIfNeeded();
          }, 300);
        });

        source.addEventListener("directory-watch-error", (event) => {
          const payload = JSON.parse(event.data || "{}");
          if (!state.rootPath || payload.rootPath !== state.rootPath) return;
          showToast(payload.message || "目录监听失败，将继续使用定时同步。", "知道了", null, { tone: "error" });
        });
      }

      async function refreshDirectoryIfNeeded() {
        if (!state.rootPath || state.refreshInFlight) return;
        state.refreshInFlight = true;

        try {
          const response = await fetch("/api/read-directory", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ rootPath: state.rootPath }),
          });
          const snapshot = await response.json().catch(() => ({}));
          if (!response.ok) {
            throw new Error(snapshot.error || "自动同步失败");
          }

          const nextSignature = snapshot.files.map((file) => `${file.path}:${file.lastModified}:${file.size}`).join("|");
          const currentSignature = state.files.map((file) => `${file.path}:${file.lastModified}:${file.size}`).join("|");

          if (nextSignature === currentSignature) return;

          state.files = snapshot.files;
          state.tree = snapshot.tree || createTreeNode(snapshot.rootName || "已选择目录");
          renderNavigation();
          els.status.textContent = `${state.files.length} 个 Markdown 文件，已同步更新`;

          if (!state.currentFile) return;

          const matched = state.files.find((file) => file.path === state.currentFile.path);
          if (!matched) {
            renderEmpty("当前文档已移除", "目录刷新后，当前打开的 Markdown 文件不存在了。");
            showToast("目录已更新，当前文档已不存在。", "知道了");
            return;
          }

          if (
            matched.lastModified !== state.currentFile.lastModified ||
            matched.size !== state.currentFile.size
          ) {
            if (state.viewMode === "history") {
              state.currentFile = matched;
              return;
            }

            const wasAi = state.viewMode === "ai";
            await openFile(matched);
            showToast(
              "当前文档已检测到更新，页面内容已同步刷新。",
              wasAi ? "生成新版 AI 阅读版" : "知道了",
              wasAi ? () => switchView("ai", { regenerate: true }) : null,
            );
          }
        } catch {
          els.status.textContent = "自动同步失败";
        } finally {
          state.refreshInFlight = false;
        }
      }

      function waitForPaint() {
        return new Promise((resolve) => {
          requestAnimationFrame(() => requestAnimationFrame(resolve));
        });
      }

      function initResizableSidebar() {
        const savedWidth = Number(localStorage.getItem("markdown-viewer-sidebar-width"));
        if (savedWidth) {
          setSidebarWidth(savedWidth);
        }

        els.resizer.addEventListener("pointerdown", (event) => {
          event.preventDefault();
          els.app.classList.add("resizing");
          els.resizer.setPointerCapture(event.pointerId);
        });

        els.resizer.addEventListener("pointermove", (event) => {
          if (!els.app.classList.contains("resizing")) return;
          const width = setSidebarWidth(event.clientX);
          localStorage.setItem("markdown-viewer-sidebar-width", String(width));
        });

        const stopResize = (event) => {
          if (!els.app.classList.contains("resizing")) return;
          els.app.classList.remove("resizing");
          if (els.resizer.hasPointerCapture(event.pointerId)) {
            els.resizer.releasePointerCapture(event.pointerId);
          }
        };

        els.resizer.addEventListener("pointerup", stopResize);
        els.resizer.addEventListener("pointercancel", stopResize);
      }

      function setSidebarWidth(width) {
        const maxWidth = Math.min(620, Math.round(window.innerWidth * 0.55));
        const nextWidth = Math.max(280, Math.min(width, maxWidth));
        document.documentElement.style.setProperty("--sidebar-width", `${nextWidth}px`);
        return nextWidth;
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function formatDate(timestamp) {
        return new Intl.DateTimeFormat("zh-CN", {
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
        }).format(new Date(timestamp));
      }

      function formatSize(bytes) {
        if (bytes < 1024) return `${bytes} B`;
        if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
        return `${(bytes / 1024 / 1024).toFixed(1)} MB`;
      }
    </script>
  </body>
</html>
