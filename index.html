<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Markdown 本地浏览器</title>
    <link rel="stylesheet" href="./styles/base.css" />
    <link rel="stylesheet" href="./styles/layout.css" />
    <link rel="stylesheet" href="./styles/markdown.css" />
    <link rel="stylesheet" href="./styles/annotations.css" />
    <link rel="stylesheet" href="./styles/history.css" />
    <link rel="stylesheet" href="./node_modules/@xterm/xterm/css/xterm.css" />
    <link rel="stylesheet" href="./styles/terminal.css" />
    <link rel="stylesheet" href="./styles/feedback.css" />
    <link rel="stylesheet" href="./styles/responsive.css" />
  </head>
  <body>
    <main class="app">
      <aside class="sidebar">
        <div class="sidebar-header">
          <div class="title-row">
            <h1>Workflow Cockpit</h1>
          </div>
          <div class="path" id="currentPath">等待连接本地工作区</div>
          <button class="choose-button" id="chooseDir" type="button">连接本地目录</button>
          <input class="search" id="search" type="search" placeholder="搜索任务文档 / Markdown" />
        </div>
        <nav class="nav" aria-label="Markdown 文件导航">
          <section class="nav-section">
            <div class="section-heading">
              <span>最近更新</span>
              <span id="recentCount">0</span>
            </div>
            <div class="file-list recent-list" id="recentList"></div>
          </section>
          <section class="nav-section">
            <div class="section-heading">
              <span>目录结构</span>
              <span id="treeCount">0</span>
            </div>
            <div class="tree" id="treeList"></div>
          </section>
        </nav>
      </aside>

      <div class="resizer" id="resizer" role="separator" aria-label="调整目录栏宽度"></div>

      <section class="viewer">
        <header class="viewer-header">
          <div class="header-identity-row">
            <div class="doc-title">
              <strong id="docName">未打开文件</strong>
              <span id="docPath">选择左侧 Markdown 文件后在这里预览</span>
            </div>
            <div class="header-global-controls">
              <div class="module-switch" aria-label="应用模块">
                <button class="module-button active" id="markdownModule" type="button">文档工作台</button>
                <button class="module-button" id="terminalModule" type="button">AI 终端</button>
                <button class="module-button" id="feedbackModule" type="button">测试反馈</button>
              </div>
              <div class="agent-availability is-idle" id="agentAvailability" role="status" aria-live="polite" aria-label="Agent 状态：无可用 Agent" title="当前没有可用的 Agent">
                <span class="agent-availability-dot" aria-hidden="true"></span>
                <span class="agent-availability-text" id="agentAvailabilityText">无可用 Agent</span>
              </div>
              <div class="status" id="status">就绪</div>
            </div>
          </div>
          <div class="header-toolbar-row">
            <div class="markdown-controls" id="markdownControls">
              <div class="view-switch" aria-label="预览模式">
                <button class="view-button active" id="rawView" type="button">原文</button>
                <button class="view-button" id="aiView" type="button">AI 阅读版</button>
              </div>
              <button class="jump-button history-action" id="historyView" type="button">注释队列</button>
              <label class="mode-switch" for="readingMode">
                <span>阅读模式</span>
                <select id="readingMode">
                  <option value="auto">自动</option>
                  <option value="general">通用</option>
                  <option value="task">任务文档</option>
                  <option value="api">接口文档</option>
                  <option value="design">设计文档</option>
                </select>
              </label>
              <button class="jump-button" id="regenerateAi" type="button" style="display: none">重新生成</button>
              <label class="auto-send-switch" for="annotationAutoSend" title="开启后，点击“仅保存”也会在保存成功后发送给 Agent">
                <input id="annotationAutoSend" type="checkbox" />
                <span>自动派发</span>
              </label>
            </div>
            <div class="history-toolbar-slot" id="historyToolbarSlot" aria-label="历史注释操作"></div>
            <div class="terminal-header-actions" id="terminalHeaderActions">
              <button class="jump-button" id="terminalRestart" type="button">新会话</button>
              <button class="jump-button" id="terminalFullscreen" type="button">全屏</button>
              <button class="jump-button" id="terminalStop" type="button">停止</button>
              <button class="jump-button" id="terminalClear" type="button">清空</button>
              <button class="jump-button" id="terminalReconnect" type="button">重新连接</button>
            </div>
          </div>
        </header>
        <button class="jump-button bottom-jump" id="scrollBottom" type="button">↓ 底部</button>
        <div class="toast" id="toast">
          <div class="toast-message" id="toastMessage"></div>
          <div class="toast-actions">
            <button class="jump-button" id="toastDismiss" type="button">稍后</button>
            <button class="jump-button" id="toastAction" type="button">切换查看</button>
          </div>
        </div>
        <button class="selection-float" id="selectionRecord" type="button">记录</button>
        <aside class="doc-outline" id="docOutline" aria-label="当前文档目录">
          <div class="outline-tabs">
            <button class="outline-tab active" id="outlineTab" type="button">目录</button>
          </div>
          <div class="outline-list" id="outlineList"></div>
        </aside>
        <section class="annotation-drawer" id="annotationDrawer" aria-label="文字记录">
          <div class="annotation-drawer-title">
            <span>文字记录</span>
            <button class="jump-button" id="annotationClose" type="button">关闭</button>
          </div>
          <div class="annotation-drawer-quote" id="annotationQuote"></div>
          <textarea class="annotation-textarea" id="annotationText" placeholder="写下这段文字的记录"></textarea>
          <div class="annotation-actions">
            <button class="jump-button" id="annotationDelete" type="button">删除</button>
            <button class="jump-button" id="annotationSave" type="button">仅保存</button>
            <button class="jump-button annotation-send-button" id="annotationSend" type="button">发送给 Agent</button>
          </div>
        </section>
        <div class="content-shell" id="contentShell">
          <div class="empty">
            <div class="empty-card">
              <h2>连接一个本地工作区</h2>
              <p>选择目录后，在这里阅读 Markdown、记录关键片段，并把上下文发送给当前 Agent。</p>
              <p class="notice" id="supportNotice"></p>
            </div>
          </div>
        </div>
      </section>
      <div class="loading-overlay" id="loadingOverlay" aria-live="polite" aria-busy="true">
        <div class="loading-panel">
          <div class="spinner" aria-hidden="true"></div>
          <div class="loading-text" id="loadingText">正在解析目录</div>
        </div>
      </div>
    </main>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
